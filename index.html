<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e24" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Iconic</title>
  </head>
  <body>
    <header class="toolbar">
      <div class="group" id="tools">
        <button data-tool="select" title="Select / move (V)">↖</button>
        <button data-tool="rect" title="Rectangle (R)">▭</button>
        <button data-tool="ellipse" title="Ellipse (E)">◯</button>
        <button data-tool="line" title="Line (L)">╱</button>
        <button data-tool="pen" title="Freehand (P)">✎</button>
      </div>
      <div class="group">
        <label title="Fill"><input type="color" id="fill" value="#4f8cff" /></label>
        <label title="Stroke"><input type="color" id="stroke" value="#1e1e24" /></label>
        <input type="range" id="strokeWidth" min="0" max="8" step="0.5" value="1" title="Stroke width" />
        <button id="noFill" title="Toggle no fill">∅</button>
      </div>
      <div class="group">
        <button id="undo" title="Undo (Ctrl+Z)">↶</button>
        <button id="redo" title="Redo (Ctrl+Y)">↷</button>
        <button id="delete" title="Delete selected (Del)">🗑</button>
        <button id="clear" title="New icon">✚</button>
      </div>
      <div class="group">
        <button id="exportSvg" title="Export SVG">SVG</button>
        <button id="exportPng" title="Export PNG">PNG</button>
      </div>
      <div class="group">
        <button id="toggleLayers" title="Layers">☰</button>
      </div>
    </header>
    <div class="workspace">
      <main class="stage">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"></svg>
      </main>
      <aside id="layers" class="layers">
        <h2>Layers</h2>
        <ul id="layerList"></ul>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
