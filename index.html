<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2c2c2c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Iconic</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar" id="topbar"></header>
      <aside class="panel panel-left" id="leftPanel" aria-label="Layers"></aside>
      <main class="viewport">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg" aria-label="Canvas"></svg>
      </main>
      <aside class="panel panel-right" id="rightPanel" aria-label="Design"></aside>
    </div>
    <dialog id="helpDialog" class="help"></dialog>
    <dialog id="reviewDialog" class="review"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
